<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thalam - Player Controller</title>
    <style>
        body { background: #162447; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a2e; border: 2px solid #ffb000; padding: 20px; border-radius: 12px; margin-top: 30px; }
        input { padding: 12px; font-size: 16px; border-radius: 6px; border: none; width: 80%; margin-bottom: 15px; }
        button { background: #ffb000; color: #162447; font-weight: bold; padding: 12px 24px; border: none; border-radius: 20px; font-size: 18px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>THALAM (தாளம்)</h1>
        
        <!-- STEP 1: USERNAME ENTRY -->
        <div id="join-screen">
            <p>Enter your name to join the game:</p>
            <input type="text" id="username" placeholder="Your Name or Nickname" maxlength="12">
            <br>
            <button onclick="joinLobby()">JOIN ROOM</button>
        </div>

        <!-- STEP 2: LOBBY WAITING SCREEN -->
        <div id="lobby-screen" class="hidden">
            <h2 style="color: #ffb000;">You're in!</h2>
            <p>Welcome, <span id="player-display-name" style="color:#00b4d8;"></span></p>
            <p>Look at the main TV screen.<br>Waiting for other players to join...</p>
            <div style="font-size: 40px; margin-top: 20px;">🎶</div>
        </div>

        <!-- STEP 3: ACTIVE GAME CONTROLLER (Revealed during play) -->
        <div id="game-screen" class="hidden">
            <h3>Song is playing on TV...</h3>
            <p>Select where this track fits on your timeline!</p>
            <button style="background-color: #e63946; color: white; margin-top: 15px;">THALAM BLOCK!</button>
        </div>
    </div>

<script>
    // Grab Room Code from URL query (e.g. thalam.party/play?room=THLM)
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('room') || "THLM";

    function joinLobby() {
        const name = document.getElementById('username').value.trim();
        if(!name) return alert("Please enter a username!");

        // Store player info locally
        localStorage.setItem("thalam_username", name);
        document.getElementById('player-display-name').innerText = name;

        // Hide Join Form & Show Waiting Room
        document.getElementById('join-screen').classList.add('hidden');
        document.getElementById('lobby-screen').classList.remove('hidden');

        // PRODUCTION TODO: Fire a Realtime WebSockets / Firebase trigger here:
        // database.ref('rooms/' + roomCode + '/players').push({ name: name, score: 0 });
    }
</script>
</body>
</html>
